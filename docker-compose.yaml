services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: DoNotGetLeftBehind
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      - postgres_network

networks:
  postgres_network:
    
